<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <section class="top-banner">
        <div class="container">
            <h1 class="heading">Bopper Weather App</h1>
            <form id="search-city-form">
                <input type="text" placeholder="Please enter a city name" autofocus>
                <button type="submit" id="city-search-button">SEARCH</button>
                <span class="msg"></span>
            </form>
        </div>
    </section>
    <section class="ajax-section">
        <div class="container">
            <ul class="cities"></ul>
            <button class="clear-all-btn">Clear All Cities</button>
        </div>
    </section>
    <script src="scripts/inputScript.js"></script>
</body>

</html>
